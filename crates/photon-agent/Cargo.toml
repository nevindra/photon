[package]
name = "photon-agent"
version = "0.2.0"
edition = "2021"

# Standalone host agent. Two jobs, both optional, both outbound-only:
#   1. the resource sampler — samples the machine with `sysinfo` (+ NVIDIA GPU via `nvml-wrapper`
#      behind the `gpu` feature) and POSTs OTLP/HTTP protobuf metrics to Photon's /v1/metrics;
#   2. the Docker fleet-management control channel (`--server` + `--token`, feature `docker`) —
#      polls `POST /api/agent/sync` with what it sees, applies desired stacks, runs one-shot
#      actions, streams logs/stats/exec back, and upgrades itself. See docs/subsystems/deploy.md.
# Not compiled by `cargo build -p photon-server`.

[[bin]]
name = "photon-agent"
path = "src/main.rs"

[lib]
name = "photon_agent"
path = "src/lib.rs"

[dependencies]
# OTLP proto MUST be workspace-pinned so payloads match Photon's decoder byte-for-byte.
opentelemetry-proto = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
# rustls so a real deployment can point `--server` at https://; `stream` for the chunked
# log/stats/exec uploads (`Body::wrap_stream`); `json` for the sync envelope.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
clap = { version = "4", features = ["derive", "env"] }
sysinfo = "0.33"
nvml-wrapper = { version = "0.10", optional = true }
# The Docker Engine API client. Optional so a metrics-only build stays small.
bollard = { version = "0.21", optional = true }
serde.workspace = true
serde_json.workspace = true
# The `auth` field of a temporary Docker `config.json` is `base64(user:secret)`.
base64 = "0.22"
# Only for injecting the `io.photon.stack` label into a rendered compose file — never a
# template engine (R1.8).
serde_yaml = "0.9"
# Self-upgrade: verify the downloaded binary against the advertised digest.
sha2.workspace = true
futures.workspace = true
# `statvfs` on Docker's root dir for the disk total/used the daemon itself does not report.
libc = "0.2"
bytes.workspace = true
tokio-stream = "0.1"
# The wire contract (`proto`) + the inventory model, and nothing else: default features off
# leaves the template/render/lint domain (and its deps) out of the agent.
photon-deploy = { path = "../photon-deploy", default-features = false }

[features]
# nvml-wrapper loads NVML dynamically via `libloading` (no link-time dependency on the NVIDIA
# driver), so it compiles fine on any host including macOS dev machines; `Nvml::init()` simply
# fails at runtime where no NVIDIA driver/GPU is present and the agent falls back to `NoGpu`.
default = ["gpu", "docker"]
gpu = ["dep:nvml-wrapper"]
# The Docker control channel. Off = every Docker capability is refused locally with a clear
# message, but the sync loop and the metrics sampler still run.
docker = ["dep:bollard"]

[dev-dependencies]
# Round-trip: assert the agent's OTLP payloads decode + map the way the real receiver maps them.
photon-ingest = { path = "../photon-ingest" }
