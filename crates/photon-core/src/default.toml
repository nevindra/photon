# Baked-in default configuration, embedded via include_str! in config.rs.
# Used only when the server is started with NO explicit config path and no ./photon.toml
# on disk (the container case). Secrets are intentionally EMPTY so an unconfigured server
# fails validation and refuses to boot — set PHOTON_INGEST_TOKEN and PHOTON_SESSION_SECRET
# (or mount a real config file) to run.

[ingest]
token = ""
http_addr = "0.0.0.0:4318"
grpc_addr = "0.0.0.0:4317"

[storage]
hot_dir = "/var/lib/photon/hot"
db_path = "/var/lib/photon/photon.db"

[retention]
days = 30

[schema]
# Keys routed OUT of the wide `attributes` map into their own Parquet column. Promotion is what
# keeps the read path cheap: the map is 63% of a span file's bytes and 96% of its decoded bytes, so
# a query that has to probe it for even one key pays for all of it. Measured on 300M spans,
# `/api/red` over 7 days took 12.3 s while touching the map and 2.2 s without.
#
# `tenant` and `http.response.status_code` are here because the Backend pages read them on EVERY
# request — `tenant` labels each row, and the HTTP status decides `http_4xx`/`http_5xx` and (with
# the span status) what counts as an error. Changing this list only affects segments written from
# now on; a query spanning the change reads both layouts correctly (`span_engine::attr_lookup`) and
# gets the speed once the older segments age out of retention.
promoted_attributes = [
    "service.name",
    "host.name",
    "deployment.environment",
    "tenant",
    "http.response.status_code",
]

[wal]
segment_max_bytes = 33554432
segment_max_age_secs = 60
group_commit_max_delay_ms = 5

[auth]
session_secret = ""
