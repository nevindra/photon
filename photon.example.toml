# Photon server example configuration.
#
# Copy this to `photon.toml` (or point the server at it explicitly) and edit for your
# deployment. The server loads its config from, in order of precedence:
#   1. the path given as the first CLI argument  (`photon-server /etc/photon.toml`)
#   2. the `PHOTON_CONFIG` environment variable
#   3. `photon.toml` in the working directory
#
# The REST/UI API binds `0.0.0.0:8080` by default; override with the `PHOTON_API_ADDR`
# environment variable.

# --- OTLP ingestion front end ------------------------------------------------------------
[ingest]
# Bearer token required on every OTLP request (gRPC metadata / HTTP `Authorization` header).
# Treat it like a password; rotate it if leaked.
token = "change-me-ingest-token"
# OTLP/HTTP receiver (protobuf `POST /v1/logs`).
http_addr = "0.0.0.0:4318"
# OTLP/gRPC receiver.
grpc_addr = "0.0.0.0:4317"
# Longest a single LONG-TAIL attribute value may be, in bytes; 0 disables the cap. Optional;
# defaults to 2048. Enforced while OTLP is mapped into Arrow, so an oversized value is cut before
# it reaches the WAL and costs nothing to fsync, compact, replicate or decode later. Measured on a
# production span corpus, capping every value: -0.2% at 8192, -2.9% at 4096, -10.8% at 2048,
# -20.6% at 1024, -30.8% at 512 — almost all of it one key, `db.query.text`, averaging 1,618
# bytes on 16% of spans. TRUNCATION IS NOT REVERSIBLE: raise it if whole SQL statements matter
# more than the bytes, or set 0 for the old unlimited behavior. Promoted attributes
# (`[schema].promoted_attributes`) are never truncated — the read path filters and groups on them.
max_attribute_value_bytes = 2048
# Max concurrently in-flight LOGS requests (HTTP + gRPC combined) before excess requests wait
# for a permit — bounds peak decoded-batch memory (roughly max_in_flight * max decoded batch
# size) so a saturation burst can't pile decoded batches on the heap. Optional; defaults to 256.
max_in_flight = 256
# Max request body size (bytes) accepted by both front doors, enforced on the DECOMPRESSED
# stream: a stock OTel Collector gzips OTLP bodies by default, so gzipped requests are
# transparently inflated first (HTTP `Content-Encoding: gzip`; gRPC `accept_compressed`), then
# this bound applies. HTTP (DefaultBodyLimit) and gRPC (max_decoding_message_size) share it so
# the two agree instead of an exporter retrying a silent 413 forever. Also caps the Prometheus
# remote-write snappy decompression. Optional; defaults to ~16 MiB (16777216).
# Override with the PHOTON_INGEST_MAX_BODY_BYTES env var.
max_body_bytes = 16777216

# --- Storage -----------------------------------------------------------------------------
[storage]
# Local hot tier: the WAL, compacted Parquet, skip indexes, and the manifest all live here.
hot_dir = "/var/lib/photon/hot"
# Shared control-plane SQLite database: UI user accounts and uptime monitors.
# Always used — required for login and by the always-on uptime subsystem.
db_path = "/var/lib/photon/photon.db"
# zstd compression level for compacted Parquet files. Range 1-19. Optional; defaults to 6.
# The level is charged to compaction, NOT to queries: decoding every column of the same file took
# 88 ms at level 1, 88 ms at 6 and 86 ms at 12, because zstd's decompression speed barely moves
# with the level. Against level 1 on merged files, level 6 measured logs -1.6%, spans -5.5%,
# metrics -12.5%. Skip level 3 — on this corpus it lands within 0.2% of level 1 while costing
# more. 19 costs ~20x the CPU and is rarely worth it. On a rotational disk the extra rewrite I/O
# competes with queries even though the CPU does not.
# zstd_level = 6

# `[storage.durable]` is OPTIONAL. Omit the whole section to run hot-tier only (no
# replication). When present, compacted objects are replicated hot -> durable to an
# S3-compatible bucket (AWS S3, MinIO, etc). `access_key_id` / `secret_access_key` are
# themselves optional — leave them out to rely on IAM roles or environment credentials.
# [storage.durable]
# endpoint = "http://minio.internal:9000"
# bucket = "photon-logs"
# region = "us-east-1"
# access_key_id = "..."
# secret_access_key = "..."

# --- Retention ---------------------------------------------------------------------------
[retention]
# Days of logs to keep. Must be > 0.
days = 30

# --- Schema ------------------------------------------------------------------------------
[schema]
# Attributes promoted to their own columns (indexed / fast to filter). Everything else is
# stored in the long-tail attributes map. `service.name` is required (it is the primary sort
# key) and each entry must be unique and must not collide with a reserved column name.
#
# `deployment.environment` is here because it is part of a subject's identity, not a label:
# `payments-api` in prod and in staging are two deployments that fail independently, and averaging
# them into one row hides real regressions. It is a global UI filter (the ContextBar's environment
# picker), so it is read on every page and earns its own column. Removing it does not break
# anything — the key still filters from the long-tail map, just without min/max pruning.
#
# `tenant` and `http.response.status_code` are here for cost, not identity. The Backend read paths
# touch both on every request (`tenant` labels each row on a federation central; the HTTP status
# decides `http_4xx`/`http_5xx` and, with the span status, what counts as an error), and probing
# the long-tail map for even one key decodes the whole map — 63% of a span file's bytes and 96% of
# its decoded bytes. Measured on 300M spans: `/api/red` over 7 days, 12.3 s touching the map
# against 2.2 s without.
#
# Changing this list only affects segments written from now on. A query spanning the change reads
# both layouts correctly, and the speed arrives once the older segments age out of retention.
promoted_attributes = [
    "service.name",
    "host.name",
    "deployment.environment",
    "tenant",
    "http.response.status_code",
]

# --- Write-ahead log ---------------------------------------------------------------------
[wal]
# Roll to a new segment once the active one exceeds this many bytes (32 MiB here). Each closed
# segment is decoded + sorted + Parquet-encoded in one compaction pass, so this value directly
# scales the compactor's peak RSS — smaller segments keep peak memory down at the cost of more,
# smaller Parquet files (merge_once runs on its own cadence to consolidate them back down).
segment_max_bytes = 33554432
# ...or once it reaches this age, whichever comes first.
segment_max_age_secs = 60
# Group-commit window: concurrent appends arriving within this many ms share one fsync.
group_commit_max_delay_ms = 5

# --- Human (UI) authentication -----------------------------------------------------------
[auth]
# Secret used to sign session cookies. Must be non-empty and at least 32 bytes long. Generate
# a strong random value, e.g.:
#   openssl rand -hex 32
# Keep it secret and stable — changing it invalidates all existing sessions.
session_secret = "replace-with-a-long-random-secret-at-least-32-bytes"

# UI users are stored in the [storage].db_path SQLite database, not in config. On first start,
# open the UI and complete the one-time "Create your account" onboarding to make the first user.
# Manage additional users from the in-app Settings dialog.

# --- Uptime monitoring ---------------------------------------------------------------------
# The uptime subsystem is always on (probes + storage in the shared [storage].db_path SQLite).
# This whole section is optional TUNING — omit it to accept the defaults shown below.
[uptime]
retention_days = 30
# webhook_url = "https://hooks.example.com/uptime"   # optional global default; per-monitor overrides
default_interval = "60s"
default_timeout = "10s"
worker_concurrency = 32

# --- APM / Services ------------------------------------------------------------------------
# Default Apdex "satisfied" latency threshold T (milliseconds) for services without a
# per-service override (set from the Services UI). tolerating = T..4T, frustrated = >4T.
[apm]
default_apdex_threshold_ms = 500

# --- Service rollup (photon.service.* / photon.operation.* metrics) ------------------------
# A background pass turns spans into per-service and per-operation RED, published as ordinary
# metrics, so the Backend pages can read a wide window without re-scanning raw spans. Always on;
# every key below is optional. Env: PHOTON_ROLLUP_ENABLED / _INTERVAL_SECS / _LAG_SECS /
# _TOP_OPERATIONS / _BACKFILL_DAYS. See docs/subsystems/rollup.md.
[rollup]
# enabled        = true   # false = never publish; the Backend pages then always scan raw spans
# interval_secs  = 60     # how often a pass runs (floored at 15)
# lag_secs       = 600    # how long a bucket stays open for late spans before it is published
#                         # ONCE and never revisited. Spans later than this never reach the rollup.
# top_operations = 50     # operation series kept per (service, environment); the tail is summed
#                         # into a single `__other__` series. 0 = service level only.
# backfill_days  = 30     # how far a FIRST run reaches back to cover spans already on disk.
#                         # Matches the default [retention].days so the rollup can answer every
#                         # window whose data this node still holds. Without it the rollup could
#                         # only describe the future, and every Backend page over a wider window
#                         # would fall back to scanning raw spans — measured on 300M spans,
#                         # /api/services/overview took 23.1 s over 7 days that way against 63 ms
#                         # off the rollup. Deliberately larger than the widest window the UI
#                         # offers: coverage starts at now-backfill_days and a 7-day window ENDS
#                         # at now, so sizing them the same puts every 7-day query exactly on the
#                         # boundary. Slices with no data left cost a manifest lookup. 0 = off.

# --- Query engine --------------------------------------------------------------------------
# Optional. One process-wide DataFusion memory pool is shared by every query engine, so this is a
# ceiling on the SUM of all concurrent queries, not a per-query allowance. Omit it and the size is
# a quarter of total RAM (read from /proc/meminfo), clamped to 256 MiB..=4 GiB — set it only to
# pin a low-memory node or to hand a big box more. Raising it does not make an unbounded query
# safe: sorts and grouped aggregations spill to disk at their fair share, and the pool stays the
# loud backstop for the operators that cannot spill.
# [query]
# memory_pool_bytes = 2147483648   # 2 GiB

# --- Real-User Monitoring (RUM) -----------------------------------------------------------
# RUM apps are managed in the UI (Frontend → Manage apps), not in config. On a fresh install
# the registry is empty and the public POST /api/rum beacon rejects everything until you
# register an app. Apps persist in the control-plane SQLite DB ([storage].db_path).

# --- Infrastructure (host/GPU resource monitoring) ----------------------------------------
# There is no [infra] config section — host/GPU metrics arrive over the same OTLP /v1/metrics
# ingest as everything else, via the standalone `photon-agent` binary (run one per host you
# want to monitor; it is not started by photon-server). `promoted_attributes` above already
# includes "host.name" so hosts are a prunable dimension. Example:
#   cargo run -p photon-agent -- \
#     --endpoint http://<this-server>:4318/v1/metrics \
#     --token <same as [ingest].token>              # or $PHOTON_INGEST_TOKEN
#     --interval-secs 15                             # or $PHOTON_AGENT_INTERVAL
#     --host-name my-gpu-box                         # or $PHOTON_AGENT_HOST; defaults to the OS hostname
# NVIDIA GPU sampling is on by default (falls back gracefully with no driver present); disable
# with --no-gpu / $PHOTON_AGENT_NO_GPU=true. See docs/subsystems/infra.md.

# --- Federation (tenant egress + central aggregation) ----------------------------------------
# Optional [federation] config (omit the whole section to disable). Enables a tenant-side Photon
# to push telemetry back to a central Photon instance, egress-only. Two modes:
#   - "summary" (default): periodic health snapshots (ingest counters, incident count, disk usage)
#   - "full" (opt-in): raw OTLP mirror (logs/traces/metrics/rum) + summary, best-effort queue
# Central stamps every federated record with a server-resolved `tenant` resource attribute
# (client labels are overwritten for security). See docs/subsystems/federation.md.
# [federation]
# endpoint = "https://central.example.com:8080"    # required: central's public OTLP/HTTP endpoint
# token = "tk_tenant_…"                            # required: per-tenant token (minted by central, never generated locally)
# mode = "summary"                                 # optional: "summary" (default) or "full"
# signals = ["traces", "rum"]                      # optional, full mode only: which signals to mirror
#                                                  # (default all four: logs, traces, metrics, rum)
# interval_secs = 30                               # optional: summary push interval in seconds (default 30, min 5)
# queue_batches = 1024                             # optional: full-mode tee queue size (default 1024, min 16); dropped on overflow

# --- Docker fleet management ---------------------------------------------------------------
# Optional. Managed agents, container inventory and lifecycle, compose stacks, templates, staged
# rollouts, and the audit log (docs/subsystems/deploy.md). Always on; omit the section to accept
# the defaults. UI users get a role (viewer / operator / admin) that gates every mutating button.
# [deploy]
# enabled            = true
# server_origin      = "https://photon.example"       # the URL agents dial; default: the request's Host
# ingest_origin      = "http://photon.example:4318"   # where agents POST metrics; default: server_origin + the [ingest] port
# secret_key_file    = "./data/deploy.key"            # AES-256 key for secret variables at rest (generated when absent)
# agent_binaries_dir = "./data/agents"                # photon-agent-<arch> served by /api/agent/download + pushed over SSH
# ssh_bootstrap      = true                           # the "Add host" SSH installer
